<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS SAA-C03 Vocabulary Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --blue-primary: #1a6bff;
    --blue-deep: #0047cc;
    --blue-soft: #e8f0ff;
    --blue-mid: #4d8bff;
    --blue-pale: #f0f5ff;
    --text-main: #0d1b2a;
    --text-muted: #6b7c9a;
    --text-light: #a0aec0;
    --border: #dce6ff;
    --success: #00c896;
    --warning: #f59e0b;
    --shadow: 0 4px 24px rgba(26,107,255,0.10);
    --shadow-lg: 0 8px 40px rgba(26,107,255,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--bg);
    border-bottom: 2px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(26,107,255,0.07);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-badge {
    background: var(--blue-primary);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    letter-spacing: 1px;
  }

  .logo-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  .logo-title span { color: var(--blue-primary); }

  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat-chip {
    background: var(--blue-pale);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--blue-deep);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--blue-primary);
  }

  /* ── Layout ── */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  /* ── Day Selector ── */
  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--blue-primary);
    margin-bottom: 16px;
  }

  .day-selector-wrap {
    background: var(--blue-pale);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 24px 28px;
    margin-bottom: 36px;
  }

  .day-selector-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .day-selector-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .progress-bar-wrap {
    background: var(--border);
    border-radius: 999px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue-primary), var(--blue-mid));
    border-radius: 999px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .day-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .day-btn {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 60px;
  }

  .day-btn:hover {
    border-color: var(--blue-primary);
    color: var(--blue-primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .day-btn.active {
    background: var(--blue-primary);
    border-color: var(--blue-primary);
    color: #fff;
    box-shadow: 0 4px 16px rgba(26,107,255,0.3);
    transform: translateY(-2px);
  }

  .day-btn.completed {
    background: var(--blue-soft);
    border-color: var(--blue-primary);
    color: var(--blue-deep);
  }

  .day-btn .check { font-size: 10px; }

  /* ── Word Cards ── */
  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .day-heading {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
  }

  .day-heading span { color: var(--blue-primary); }

  .mode-toggle {
    display: flex;
    gap: 8px;
  }

  .mode-btn {
    background: var(--blue-pale);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .mode-btn.active {
    background: var(--blue-primary);
    border-color: var(--blue-primary);
    color: #fff;
  }

  /* Grid mode */
  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .word-card {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .word-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--blue-primary);
    border-radius: 4px 0 0 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .word-card:hover {
    border-color: var(--blue-primary);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .word-card:hover::before { opacity: 1; }

  .word-card.learned {
    border-color: var(--success);
    background: #f0fff9;
  }

  .word-card.learned::before {
    background: var(--success);
    opacity: 1;
  }

  .word-num {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .word-term {
    font-size: 15px;
    font-weight: 700;
    color: var(--blue-deep);
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .word-vi {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 400;
  }

  .word-desc {
    font-size: 12.5px;
    color: var(--text-main);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: none;
  }

  .word-card.expanded .word-desc { display: block; }

  .word-tag {
    display: inline-flex;
    align-items: center;
    background: var(--blue-soft);
    color: var(--blue-primary);
    font-size: 10px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .learn-btn {
    flex: 1;
    background: var(--blue-pale);
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--blue-primary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .learn-btn:hover {
    background: var(--blue-primary);
    color: #fff;
    border-color: var(--blue-primary);
  }

  .learn-btn.done {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }

  /* Flashcard mode */
  .flashcard-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .flashcard-wrap.active { display: flex; }

  .flashcard {
    width: 100%;
    max-width: 560px;
    height: 280px;
    perspective: 1000px;
    cursor: pointer;
  }

  .flashcard-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,0,.2,1);
  }

  .flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
  }

  .flashcard-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }

  .flashcard-front {
    background: var(--blue-primary);
    box-shadow: 0 8px 40px rgba(26,107,255,0.3);
  }

  .flashcard-front .fc-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  .flashcard-front .fc-term {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }

  .flashcard-front .fc-hint {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }

  .flashcard-back {
    background: #fff;
    border: 3px solid var(--blue-primary);
    transform: rotateY(180deg);
  }

  .flashcard-back .fc-vi {
    font-size: 22px;
    font-weight: 700;
    color: var(--blue-deep);
    margin-bottom: 12px;
  }

  .flashcard-back .fc-desc {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .fc-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .fc-nav-btn {
    background: var(--blue-pale);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 700;
    color: var(--blue-primary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .fc-nav-btn:hover {
    background: var(--blue-primary);
    color: #fff;
    border-color: var(--blue-primary);
  }

  .fc-counter {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 60px;
    text-align: center;
  }

  /* Word grid visible state */
  .word-grid-wrap { display: block; }
  .word-grid-wrap.hidden { display: none; }

  /* Footer */
  .site-footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--text-light);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 60px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .word-grid { grid-template-columns: 1fr; }
    .day-heading { font-size: 22px; }
    header { padding: 14px 16px; }
    .day-selector-wrap { padding: 18px 16px; }
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .word-card { animation: fadeUp 0.3s ease both; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-badge">AWS</span>
    <span class="logo-title">Vocab <span>Trainer</span></span>
  </div>
  <div class="header-stats">
    <div class="stat-chip"><span class="dot"></span><span id="learned-count">0</span> / 300 từ</div>
    <div class="stat-chip" id="day-chip">Ngày 1</div>
  </div>
</header>

<div class="container">

  <!-- Day Selector -->
  <div class="day-selector-wrap">
    <div class="section-label">Lộ trình học</div>
    <div class="day-selector-title">Chọn ngày học hôm nay</div>
    <div class="day-selector-sub">300 thuật ngữ AWS kỹ thuật · 15 ngày · 20 từ/ngày</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="overall-progress" style="width:0%"></div>
    </div>
    <div class="day-grid" id="day-grid"></div>
  </div>

  <!-- Day Content -->
  <div id="day-content" style="display:none">
    <div class="day-header">
      <div>
        <div class="section-label" id="day-label">NGÀY 1</div>
        <div class="day-heading" id="day-heading">Ngày <span id="day-num">1</span> — 20 từ</div>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-grid" onclick="setMode('grid')">📋 Danh sách</button>
        <button class="mode-btn" id="btn-flash" onclick="setMode('flash')">🃏 Flashcard</button>
      </div>
    </div>

    <!-- Grid mode -->
    <div class="word-grid-wrap" id="grid-wrap">
      <div class="word-grid" id="word-grid"></div>
    </div>

    <!-- Flashcard mode -->
    <div class="flashcard-wrap" id="flash-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="fc-label">THUẬT NGỮ AWS</div>
            <div class="fc-term" id="fc-term">—</div>
            <div class="fc-hint">Nhấn để lật xem nghĩa</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="fc-vi" id="fc-vi">—</div>
            <div class="fc-desc" id="fc-desc">—</div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="fc-nav-btn" onclick="fcNav(-1)">← Trước</button>
        <div class="fc-counter" id="fc-counter">1 / 20</div>
        <button class="fc-nav-btn" onclick="fcNav(1)">Sau →</button>
      </div>
    </div>
  </div>

</div>

<div class="site-footer">AWS SAA-C03 Vocabulary Trainer · Nhóm 1: Thuật ngữ kỹ thuật · 300 từ · 15 ngày</div>

<script>

const ALL_WORDS = [
  // DAY 1 – Core Architecture Concepts
  { term:"High Availability", vi:"Tính sẵn sàng cao", desc:"Hệ thống hoạt động liên tục, giảm thiểu downtime. Thường đạt được qua Multi-AZ." },

  { term:"App Runner", vi:"Triển khai web app nhanh", desc:"Build và deploy web apps/APIs từ source code hoặc container, fully managed, auto scale." },
  { term:"Lightsail", vi:"Hosting đơn giản", desc:"VPS đơn giản với giá cố định, phù hợp project nhỏ, có instance, database, storage." },
  { term:"Amplify", vi:"Phát triển ứng dụng full-stack", desc:"Framework deploy web/mobile app với CI/CD, hosting, authentication, API tự động." },
  { term:"Device Farm", vi:"Kiểm thử thiết bị thực", desc:"Test ứng dụng mobile/web trên hàng trăm thiết bị thật, browser trong cloud." },
  { term:"Ground Station", vi:"Trạm điều khiển vệ tinh", desc:"Managed ground station để communicate với vệ tinh, xử lý data ngay trên AWS." },
  { term:"Braket", vi:"Điện toán lượng tử", desc:"AWS Braket – môi trường để phát triển, test quantum algorithms trên quantum hardware." },
  { term:"IQ", vi:"Kết nối chuyên gia AWS", desc:"Marketplace kết nối bạn với AWS Certified experts để làm dự án, trả phí qua AWS." },
  { term:"Support Plans", vi:"Gói hỗ trợ AWS", desc:"Basic (free), Developer, Business, Enterprise On-Ramp, Enterprise – tăng dần hỗ trợ và SLA." }
];

// Chunk into days of 20
const DAYS = [];
for (let i = 0; i < ALL_WORDS.length; i += 20) {
  DAYS.push(ALL_WORDS.slice(i, i + 20));
}

// State
let currentDay = 0;
let learned = JSON.parse(localStorage.getItem('aws_learned') || '{}');
let expanded = {};
let fcIndex = 0;
let fcFlipped = false;
let currentMode = 'grid';

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  renderDayGrid();
  updateStats();
  selectDay(0);
}

function updateStats() {
  const count = Object.keys(learned).filter(k => learned[k]).length;
  document.getElementById('learned-count').textContent = count;
  const pct = (count / ALL_WORDS.length * 100).toFixed(0);
  document.getElementById('overall-progress').style.width = pct + '%';
}

function renderDayGrid() {
  const grid = document.getElementById('day-grid');
  grid.innerHTML = '';
  DAYS.forEach((day, i) => {
    const dayLearned = day.filter((w, wi) => learned[i * 20 + wi]).length;
    const done = dayLearned === 20;
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (i === currentDay ? ' active' : '') + (done ? ' completed' : '');
    btn.innerHTML = `D${i+1}<span class="check">${done ? '✓' : dayLearned > 0 ? dayLearned+'/20' : ''}</span>`;
    btn.onclick = () => selectDay(i);
    grid.appendChild(btn);
  });
}

function selectDay(dayIdx) {
  currentDay = dayIdx;
  fcIndex = 0;
  fcFlipped = false;
  expanded = {};
  document.getElementById('day-content').style.display = 'block';
  document.getElementById('day-num').textContent = dayIdx + 1;
  document.getElementById('day-label').textContent = 'NGÀY ' + (dayIdx + 1);
  document.getElementById('day-chip').textContent = 'Ngày ' + (dayIdx + 1);
  renderDayGrid();
  renderWords();
  renderFlashcard();
}

// ── Word Grid ─────────────────────────────────────────────────────────────────
function renderWords() {
  const words = DAYS[currentDay];
  const grid = document.getElementById('word-grid');
  grid.innerHTML = '';
  words.forEach((w, i) => {
    const globalIdx = currentDay * 20 + i;
    const isLearned = learned[globalIdx];
    const isExpanded = expanded[i];
    const card = document.createElement('div');
    card.className = 'word-card' + (isLearned ? ' learned' : '') + (isExpanded ? ' expanded' : '');
    card.style.animationDelay = (i * 0.03) + 's';
    card.innerHTML = `
      <div class="word-num">${String(i+1).padStart(2,'0')} / 20</div>
      <div class="word-tag">AWS TECH</div>
      <div class="word-term">${w.term}</div>
      <div class="word-vi">${w.vi}</div>
      <div class="word-desc">${w.desc}</div>
      <div class="card-actions">
        <button class="learn-btn" onclick="event.stopPropagation(); toggleExpand(${i})">
          ${isExpanded ? '▲ Thu gọn' : '▼ Giải thích'}
        </button>
        <button class="learn-btn ${isLearned ? 'done' : ''}" onclick="event.stopPropagation(); toggleLearn(${globalIdx})">
          ${isLearned ? '✓ Đã thuộc' : '+ Đánh dấu'}
        </button>
      </div>`;
    grid.appendChild(card);
  });
}

function toggleExpand(i) {
  expanded[i] = !expanded[i];
  renderWords();
}

function toggleLearn(globalIdx) {
  learned[globalIdx] = !learned[globalIdx];
  localStorage.setItem('aws_learned', JSON.stringify(learned));
  updateStats();
  renderWords();
  renderDayGrid();
}

// ── Flashcard ─────────────────────────────────────────────────────────────────
function renderFlashcard() {
  const words = DAYS[currentDay];
  const w = words[fcIndex];
  document.getElementById('fc-term').textContent = w.term;
  document.getElementById('fc-vi').textContent = w.vi;
  document.getElementById('fc-desc').textContent = w.desc;
  document.getElementById('fc-counter').textContent = `${fcIndex+1} / 20`;
  const fc = document.getElementById('flashcard');
  fc.classList.remove('flipped');
  fcFlipped = false;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', fcFlipped);
}

function fcNav(dir) {
  const words = DAYS[currentDay];
  fcIndex = (fcIndex + dir + words.length) % words.length;
  renderFlashcard();
}

// ── Mode ──────────────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-grid').classList.toggle('active', mode === 'grid');
  document.getElementById('btn-flash').classList.toggle('active', mode === 'flash');
  document.getElementById('grid-wrap').classList.toggle('hidden', mode !== 'grid');
  document.getElementById('flash-wrap').classList.toggle('active', mode === 'flash');
  if (mode === 'flash') renderFlashcard();
}

init();
</script>
</body>
</html>
